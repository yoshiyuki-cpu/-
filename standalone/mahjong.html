<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>麻雀 待ち判定</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f1f5f4; color: #1f2937; min-height: 100vh; }
  header { background: linear-gradient(120deg, #064e3b, #047857); color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  header h1 { font-size: 17px; }
  header p { font-size: 11px; opacity: .8; margin-top: 2px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 14px 48px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { border: none; border-radius: 14px; padding: 15px 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform .05s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; }
  .btn-camera { background: linear-gradient(120deg, #059669, #16a34a); color: #fff; box-shadow: 0 3px 10px rgba(5,150,105,.3); }
  .btn-gallery { background: #fff; color: #374151; border: 1px solid #d1d5db; }
  .status { border-radius: 12px; padding: 11px 13px; font-size: 13px; display: none; }
  .status.show { display: block; }
  .status.info { background: #eff6ff; color: #1d4ed8; border: 1px solid #dbeafe; }
  .status.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; font-size: 12px; }
  .status.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  h2 { font-size: 13px; color: #374151; margin-bottom: 8px; }
  h2 small { color: #9ca3af; font-weight: 400; }
  .tiles { display: flex; flex-wrap: wrap; gap: 4px; }
  .tile { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 38px; height: 52px; background: #fffdf8; border: 1px solid #cbd5d1; border-bottom-width: 3px; border-radius: 6px; font-weight: 700; font-size: 18px; line-height: 1; cursor: pointer; user-select: none; }
  .tile small { font-size: 9px; margin-top: 2px; }
  .tile.sm { width: 31px; height: 43px; font-size: 14px; }
  .tile.m { color: #b91c1c; }
  .tile.p { color: #1d4ed8; }
  .tile.s { color: #15803d; }
  .tile.z { color: #1f2937; }
  .tile.hatsu { color: #15803d; }
  .tile.chun { color: #dc2626; }
  button.tile:disabled { opacity: .25; cursor: default; }
  .empty { text-align: center; color: #9ca3af; font-size: 13px; padding: 12px 0; }
  .clear-btn { float: right; font-size: 11px; color: #ef4444; background: none; border: 1px solid #fca5a5; border-radius: 99px; padding: 3px 10px; cursor: pointer; }
  .result-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .result-title.ok { color: #047857; }
  .result-title.ng { color: #6b7280; }
  .result-title.agari { color: #e11d48; }
  .wait-group { display: flex; flex-wrap: wrap; gap: 10px; }
  .wait-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .wait-item span.count { font-size: 10px; color: #6b7280; }
  .note { font-size: 10px; color: #9ca3af; margin-top: 8px; }
  .discard-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid #f3f4f6; }
  .discard-row:first-of-type { border-top: none; padding-top: 0; }
  .discard-label { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: #6b7280; flex-shrink: 0; }
  .discard-waits { flex: 1; }
  .discard-waits p { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
  .picker-row { margin-bottom: 8px; }
  .picker-row p { font-size: 10px; color: #9ca3af; margin-bottom: 4px; }
  details { font-size: 12px; color: #6b7280; }
  details summary { cursor: pointer; font-weight: 600; color: #374151; font-size: 13px; }
  details input { width: 100%; margin-top: 8px; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 13px; }
  details button { margin-top: 8px; padding: 8px 16px; border: none; border-radius: 10px; background: #047857; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
  details .hint { margin-top: 8px; font-size: 11px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <h1>🀄 麻雀 待ち判定</h1>
  <p>手牌を撮影するか、牌をタップで入力すると待ちがわかります</p>
</header>
<main>
  <div class="btn-row">
    <button class="btn btn-camera" id="btnCamera">📷 手牌を撮影</button>
    <button class="btn btn-gallery" id="btnGallery">🖼 写真から選ぶ</button>
    <input type="file" accept="image/*" capture="environment" id="inputCamera" hidden>
    <input type="file" accept="image/*" id="inputGallery" hidden>
  </div>

  <div class="status" id="status"></div>

  <section class="card">
    <button class="clear-btn" id="btnClear" style="display:none">全消去</button>
    <h2>手牌 <small id="handCount">0枚（タップで削除）</small></h2>
    <div class="tiles" id="hand"></div>
    <p class="empty" id="handEmpty">まだ牌がありません</p>
  </section>

  <section class="card" id="resultCard" style="display:none">
    <div id="result"></div>
  </section>

  <section class="card">
    <h2>牌を追加</h2>
    <div id="picker"></div>
    <p class="note">ポン・チー・カンしている場合は、その分を除いた手元の牌だけ入力してください（10枚・7枚・4枚でも判定できます）</p>
  </section>

  <section class="card">
    <details>
      <summary>⚙️ 写真読み取りの設定（APIキー）</summary>
      <input type="password" id="apiKey" placeholder="Anthropic APIキー（sk-ant-...）">
      <button id="btnSaveKey">保存</button>
      <p class="hint">
        写真からの牌読み取りにはAnthropicのAPIキーが必要です（<a href="https://console.anthropic.com/" target="_blank">console.anthropic.com</a> で取得）。
        キーはこの端末のブラウザ内にのみ保存され、Anthropic以外には送信されません。
        牌の手入力だけならAPIキーなしで使えます。
      </p>
    </details>
  </section>
</main>

<script>
'use strict';

// ============ 牌の定義 ============
// 0-8=一〜九萬, 9-17=一〜九筒, 18-26=一〜九索, 27-33=東南西北白發中
const N = 34;
const KANJI = ['一','二','三','四','五','六','七','八','九'];
const HONOR = ['東','南','西','北','白','發','中'];
const CODES = [];
for (const s of ['m','p','s']) for (let i = 1; i <= 9; i++) CODES.push(i + s);
for (let i = 1; i <= 7; i++) CODES.push(i + 'z');

const suitOf = t => t < 9 ? 'm' : t < 18 ? 'p' : t < 27 ? 's' : 'z';
const numOf = t => t % 9 + 1;

function labelOf(t) {
  const s = suitOf(t);
  if (s === 'z') return { main: HONOR[t - 27], sub: '' };
  if (s === 'm') return { main: KANJI[numOf(t) - 1], sub: '萬' };
  return { main: String(numOf(t)), sub: s === 'p' ? '筒' : '索' };
}

function codeToTile(code) {
  const m = /^([0-9])([mpsz])$/.exec(String(code).trim().toLowerCase());
  if (!m) return null;
  let n = Number(m[1]);
  const s = m[2];
  if (n === 0) { if (s === 'z') return null; n = 5; } // 赤5は通常の5扱い
  if (s === 'm') return n - 1;
  if (s === 'p') return 9 + n - 1;
  if (s === 's') return 18 + n - 1;
  return n >= 1 && n <= 7 ? 27 + n - 1 : null;
}

// ============ 和了判定 ============
function canFormSets(c) {
  let i = 0;
  while (i < N && c[i] === 0) i++;
  if (i === N) return true;
  if (c[i] >= 3) {
    c[i] -= 3;
    if (canFormSets(c)) { c[i] += 3; return true; }
    c[i] += 3;
  }
  if (i < 27 && numOf(i) <= 7 && c[i+1] > 0 && c[i+2] > 0) {
    c[i]--; c[i+1]--; c[i+2]--;
    if (canFormSets(c)) { c[i]++; c[i+1]++; c[i+2]++; return true; }
    c[i]++; c[i+1]++; c[i+2]++;
  }
  return false;
}

function isStandardAgari(c) {
  for (let p = 0; p < N; p++) {
    if (c[p] < 2) continue;
    c[p] -= 2;
    const ok = canFormSets(c);
    c[p] += 2;
    if (ok) return true;
  }
  return false;
}

function isChiitoiAgari(c) {
  let pairs = 0;
  for (let i = 0; i < N; i++) {
    if (c[i] !== 0 && c[i] !== 2) return false;
    if (c[i] === 2) pairs++;
  }
  return pairs === 7;
}

const KOKUSHI = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];

function isKokushiAgari(c) {
  let hasPair = false;
  for (let i = 0; i < N; i++) {
    if (c[i] === 0) continue;
    if (!KOKUSHI.includes(i)) return false;
    if (c[i] === 2) hasPair = true;
    else if (c[i] !== 1) return false;
  }
  return hasPair && KOKUSHI.every(t => c[t] >= 1);
}

function isAgari(c) {
  const total = c.reduce((a, b) => a + b, 0);
  if (total % 3 !== 2) return false;
  if (total === 14 && (isChiitoiAgari(c) || isKokushiAgari(c))) return true;
  return isStandardAgari(c);
}

// ============ 向聴数 ============
function chiitoiShanten(c) {
  let pairs = 0, kinds = 0;
  for (let i = 0; i < N; i++) {
    if (c[i] > 0) kinds++;
    if (c[i] >= 2) pairs++;
  }
  return 6 - pairs + Math.max(0, 7 - kinds);
}

function kokushiShanten(c) {
  let kinds = 0, hasPair = false;
  for (const t of KOKUSHI) {
    if (c[t] > 0) kinds++;
    if (c[t] >= 2) hasPair = true;
  }
  return 13 - kinds - (hasPair ? 1 : 0);
}

function standardShanten(c) {
  let best = 8;
  function dfs(i, sets, partials, hasPair) {
    while (i < N && c[i] === 0) i++;
    if (i === N) {
      const usable = Math.min(partials, 4 - sets);
      const sh = 8 - 2 * sets - usable - (hasPair ? 1 : 0);
      if (sh < best) best = sh;
      return;
    }
    if (c[i] >= 3) { c[i] -= 3; dfs(i, sets + 1, partials, hasPair); c[i] += 3; }
    if (i < 27 && numOf(i) <= 7 && c[i+1] > 0 && c[i+2] > 0) {
      c[i]--; c[i+1]--; c[i+2]--;
      dfs(i, sets + 1, partials, hasPair);
      c[i]++; c[i+1]++; c[i+2]++;
    }
    if (c[i] >= 2) {
      c[i] -= 2;
      if (!hasPair) dfs(i, sets, partials, true);
      dfs(i, sets, partials + 1, hasPair);
      c[i] += 2;
    }
    if (i < 27 && numOf(i) <= 8 && c[i+1] > 0) {
      c[i]--; c[i+1]--;
      dfs(i, sets, partials + 1, hasPair);
      c[i]++; c[i+1]++;
    }
    if (i < 27 && numOf(i) <= 7 && c[i+2] > 0) {
      c[i]--; c[i+2]--;
      dfs(i, sets, partials + 1, hasPair);
      c[i]++; c[i+2]++;
    }
    const saved = c[i];
    c[i] = 0;
    dfs(i + 1, sets, partials, hasPair);
    c[i] = saved;
  }
  dfs(0, 0, 0, false);
  return best;
}

function calcShanten(c) {
  const total = c.reduce((a, b) => a + b, 0);
  let s = standardShanten(c);
  if (total >= 13) s = Math.min(s, chiitoiShanten(c), kokushiShanten(c));
  return s;
}

// ============ 待ち計算 ============
function calcWaits(c) {
  const waits = [];
  for (let t = 0; t < N; t++) {
    if (c[t] >= 4) continue;
    c[t]++;
    const ok = isAgari(c);
    c[t]--;
    if (ok) waits.push({ tile: t, remaining: 4 - c[t] });
  }
  return waits;
}

function calcDiscardOptions(c) {
  const options = [];
  for (let d = 0; d < N; d++) {
    if (c[d] === 0) continue;
    c[d]--;
    const waits = calcWaits(c);
    c[d]++;
    if (waits.length > 0) {
      options.push({ discard: d, waits, total: waits.reduce((s, w) => s + w.remaining, 0) });
    }
  }
  options.sort((a, b) => b.total - a.total);
  return options;
}

// ============ UI ============
let hand = [];
let fromPhoto = false;

const $ = id => document.getElementById(id);

function tileHTML(t, small, attrs) {
  const { main, sub } = labelOf(t);
  let cls = suitOf(t);
  if (t === 32) cls += ' hatsu';
  if (t === 33) cls += ' chun';
  const tag = attrs ? 'button' : 'span';
  return `<${tag} class="tile ${cls}${small ? ' sm' : ''}"${attrs || ''}>${main}${sub ? `<small>${sub}</small>` : ''}</${tag}>`;
}

function counts() {
  const c = new Array(N).fill(0);
  for (const t of hand) c[t]++;
  return c;
}

function setStatus(type, html) {
  const el = $('status');
  if (!type) { el.className = 'status'; el.innerHTML = ''; return; }
  el.className = 'status show ' + type + (type === 'info' ? ' pulse' : '');
  el.innerHTML = html;
}

function render() {
  const c = counts();

  // 手牌
  $('handCount').textContent = hand.length + '枚（タップで削除）';
  $('hand').innerHTML = hand.map((t, i) => tileHTML(t, false, ` data-i="${i}"`)).join('');
  $('handEmpty').style.display = hand.length ? 'none' : 'block';
  $('btnClear').style.display = hand.length ? 'inline-block' : 'none';

  // 牌選択
  const rows = [
    { label: '萬子', tiles: [0,1,2,3,4,5,6,7,8] },
    { label: '筒子', tiles: [9,10,11,12,13,14,15,16,17] },
    { label: '索子', tiles: [18,19,20,21,22,23,24,25,26] },
    { label: '字牌', tiles: [27,28,29,30,31,32,33] },
  ];
  $('picker').innerHTML = rows.map(r =>
    `<div class="picker-row"><p>${r.label}</p><div class="tiles">` +
    r.tiles.map(t => tileHTML(t, true, ` data-add="${t}"${c[t] >= 4 || hand.length >= 14 ? ' disabled' : ''}`)).join('') +
    '</div></div>'
  ).join('');

  // 判定結果
  const card = $('resultCard');
  const res = $('result');
  const n = hand.length;
  if (n === 0) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  if (n % 3 === 1) {
    const waits = calcWaits(c);
    if (waits.length > 0) {
      const total = waits.reduce((s, w) => s + w.remaining, 0);
      res.innerHTML =
        `<p class="result-title ok">✅ 聴牌！ 待ちは ${waits.length} 種 ${total} 枚</p>` +
        `<div class="wait-group">` +
        waits.map(w => `<div class="wait-item">${tileHTML(w.tile)}<span class="count">残り${w.remaining}枚</span></div>`).join('') +
        `</div>` +
        `<p class="note">※残り枚数は自分の手牌から見えていない枚数です（他家の手牌・捨て牌は含みません）</p>`;
    } else {
      const sh = n === 13 ? calcShanten(c) : null;
      res.innerHTML = `<p class="result-title ng">❌ 聴牌していません${sh !== null && sh >= 1 ? `（${sh}向聴）` : ''}</p>`;
    }
  } else if (n % 3 === 2) {
    if (isAgari(c)) {
      res.innerHTML = `<p class="result-title agari">🎉 和了（あがり）の形です！</p>`;
    } else {
      const opts = calcDiscardOptions(c);
      if (opts.length > 0) {
        res.innerHTML =
          `<p class="result-title ok">✅ 聴牌！ 切る牌ごとの待ち（枚数が多い順）</p>` +
          opts.map(o =>
            `<div class="discard-row">` +
            `<div class="discard-label"><span>切る</span>${tileHTML(o.discard)}</div>` +
            `<div class="discard-waits"><p>待ち ${o.waits.length}種 ${o.total}枚</p>` +
            `<div class="tiles">${o.waits.map(w => tileHTML(w.tile, true)).join('')}</div></div>` +
            `</div>`
          ).join('');
      } else {
        res.innerHTML = `<p class="result-title ng">❌ 聴牌していません（どれを切っても聴牌になりません）</p>`;
      }
    }
  } else {
    res.innerHTML = `<p class="result-title ng">ツモ前なら13枚・ツモ後なら14枚にしてください（副露分は除く）</p>`;
  }
}

// ============ 写真読み取り ============
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const maxSide = 1568;
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}

async function analyzePhoto(file) {
  const key = localStorage.getItem('mahjong_api_key');
  if (!key) {
    setStatus('error', '写真読み取りにはAPIキーが必要です。下の「⚙️ 写真読み取りの設定」でキーを保存してください。（牌の手入力はキーなしで使えます）');
    return;
  }
  setStatus('info', '🔍 AIが牌を読み取っています...');
  try {
    const data = await compressImage(file);
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-5',
        max_tokens: 512,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data } },
            { type: 'text', text: 'これは麻雀の手牌の写真です。写っている牌を左から右の順にすべて読み取り、mpsz形式でJSONのみ返してください。{"tiles": ["1m", "2p", "3s", "1z", ...]}。表記: 萬子=1m〜9m、筒子=1p〜9p、索子=1s〜9s、字牌=東1z 南2z 西3z 北4z 白5z 發6z 中7z、赤5は0m/0p/0s。横向きの牌や副露も含めてください。牌がはっきり判別できない場合や麻雀牌の写真でない場合は {"tiles": []} を返してください。JSONのみ返してください。' },
          ],
        }],
      }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error && json.error.message || 'APIエラー（キーが正しいか確認してください）');
    const text = json.content[0].text.trim().replace(/```json\n?|\n?```/g, '').trim();
    const parsed = JSON.parse(text);
    const tiles = [];
    const c = new Array(N).fill(0);
    for (const code of parsed.tiles || []) {
      const t = codeToTile(code);
      if (t !== null && c[t] < 4 && tiles.length < 14) { c[t]++; tiles.push(t); }
    }
    if (tiles.length === 0) {
      setStatus('error', '牌を読み取れませんでした。明るい場所で牌を正面から撮影してください。');
    } else {
      hand = tiles.sort((a, b) => a - b);
      fromPhoto = true;
      setStatus('warn', '⚠️ 読み取り結果を確認してください。間違っている牌はタップで消して、下の牌一覧から追加できます。');
      render();
    }
  } catch (e) {
    setStatus('error', e.message || '解析に失敗しました');
  }
}

// ============ イベント ============
$('btnCamera').onclick = () => $('inputCamera').click();
$('btnGallery').onclick = () => $('inputGallery').click();
for (const id of ['inputCamera', 'inputGallery']) {
  $(id).onchange = e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (f) analyzePhoto(f);
  };
}
$('btnClear').onclick = () => { hand = []; fromPhoto = false; setStatus(null); render(); };
$('hand').onclick = e => {
  const b = e.target.closest('[data-i]');
  if (!b) return;
  hand.splice(Number(b.dataset.i), 1);
  render();
};
$('picker').onclick = e => {
  const b = e.target.closest('[data-add]');
  if (!b || b.disabled) return;
  hand.push(Number(b.dataset.add));
  hand.sort((a, b2) => a - b2);
  render();
};
$('btnSaveKey').onclick = () => {
  const v = $('apiKey').value.trim();
  if (v) {
    localStorage.setItem('mahjong_api_key', v);
    setStatus('info', '✅ APIキーを保存しました。写真読み取りが使えます。');
    setTimeout(() => setStatus(null), 2500);
  } else {
    localStorage.removeItem('mahjong_api_key');
  }
};
if (localStorage.getItem('mahjong_api_key')) $('apiKey').value = localStorage.getItem('mahjong_api_key');

render();
</script>
</body>
</html>
